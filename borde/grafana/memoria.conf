# Drop-in de systemd para grafana-server en una Raspberry Pi de 1 GB: límite blando de memoria del recolector de
# basura de Go. Grafana 13 llegó a 452 MB a los 11 min de arrancar con el tablero de operación abierto. GOMEMLIMIT no
# corta el proceso: le indica al recolector que libere memoria antes de pasar de ese valor.
# Se instala en /etc/systemd/system/grafana-server.service.d/memoria.conf (instalar_operacion.sh).
[Service]
Environment=GOMEMLIMIT=300MiB
