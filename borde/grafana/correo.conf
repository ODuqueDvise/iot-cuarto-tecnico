# Drop-in de systemd para grafana-server: carga la configuración de correo (SMTP) de /etc/grafana/correo.env.
# systemd lee ese archivo como root, así que puede quedar con permisos 600 de root.
# Se instala en /etc/systemd/system/grafana-server.service.d/correo.conf (instalar_operacion.sh).
[Service]
EnvironmentFile=/etc/grafana/correo.env
