# Listas de control por tema. %u es el nombre de usuario, que viene del CN del certificado.
# Cada dispositivo solo escribe en sus propios temas y solo lee sus comandos.
pattern write cuarto/%u/telemetria
pattern write cuarto/%u/estado
pattern read cuarto/%u/comandos

# El puente del borde lee todo y publica comandos.
user borde-puente
topic readwrite cuarto/#
