# /etc/mosquitto/conf.d/iot.conf
# Un solo escucha, TLS con autenticación mutua. El CN del certificado del cliente es su nombre de usuario.
per_listener_settings false
listener 8883
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/borde.crt
keyfile /etc/mosquitto/certs/borde.key
tls_version tlsv1.2
require_certificate true
use_identity_as_username true
allow_anonymous false
acl_file /etc/mosquitto/acl.conf
persistence true
persistence_location /var/lib/mosquitto/
max_queued_messages 10000
